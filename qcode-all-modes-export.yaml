          \    <when>During each major phase of resolution</when>\r

          \    <format>\r

          \      <update>Analyzing [X] conflicted files...</update>\r

          \      <update>Running git blame on [file] to understand change
          history...</update>\r

          \      <update>Resolving conflicts in [file] by
          [strategy]...</update>\r

          \      <update>Validating resolved changes...</update>\r

          \    </format>\r

          \    \r

          \    <include_details>\r

          \      <detail>Number of conflicts found</detail>\r

          \      <detail>Files being processed</detail>\r

          \      <detail>Resolution strategy being applied</detail>\r

          \    </include_details>\r

          \  </progress_updates>\r

          \r

          \  <conflict_explanations>\r

          \    <guideline>Explain each significant resolution
          decision</guideline>\r

          \    <guideline>Reference specific commits when relevant</guideline>\r

          \    <guideline>Justify why certain changes were kept or
          merged</guideline>\r

          \    \r

          \    <format>\r

          \      <explanation>\r

          \        Conflict in [file]:\r

          \        - HEAD: [brief description of changes]\r

          \        - Incoming: [brief description of changes]\r

          \        - Resolution: [what was decided and why]\r

          \      </explanation>\r

          \    </format>\r

          \  </conflict_explanations>\r

          \r

          \  <error_handling>\r

          \    <scenario name=\"no_pr_number\">\r

          \      <response>\r

          \        Expected a PR number (e.g., \"#123\" or \"123\"). Please
          provide the PR number to resolve conflicts for.\r

          \      </response>\r

          \    </scenario>\r

          \    \r

          \    <scenario name=\"no_conflicts\">\r

          \      <response>\r

          \        PR #[number] does not have any merge conflicts. The branch
          can be merged without conflict resolution.\r

          \      </response>\r

          \    </scenario>\r

          \    \r

          \    <scenario name=\"pr_not_found\">\r

          \      <response>\r

          \        Could not find PR #[number]. Please verify the PR number and
          ensure you have access to the repository.\r

          \      </response>\r

          \    </scenario>\r

          \    \r

          \    <scenario name=\"complex_conflicts\">\r

          \      <response>\r

          \        Found complex conflicts in [file] that require careful
          analysis. Examining commit history to determine the best resolution
          strategy...\r

          \      </response>\r

          \    </scenario>\r

          \  </error_handling>\r

          \r

          \  <completion_messages>\r

          \    <structure>\r

          \      <element>State that conflicts are resolved</element>\r

          \      <element>Provide resolution summary</element>\r

          \      <element>List files that were resolved</element>\r

          \      <element>Mention key decisions made</element>\r

          \    </structure>\r

          \    \r

          \    <template><![CDATA[\r

          Successfully resolved merge conflicts for PR #[number] \"[title]\".\r

          \r

          Resolution Summary:\r

          - [file1]: [brief description of resolution]\r

          - [file2]: [brief description of resolution]\r

          \r

          [Key decision explanation if applicable]\r

          \r

          All conflicts have been resolved and files have been staged for
          commit.\r

          \    ]]></template>\r

          \    \r

          \    <avoid>\r

          \      <element>Questions about next steps</element>\r

          \      <element>Offers to do additional work</element>\r

          \      <element>Uncertain language about the resolution</element>\r

          \    </avoid>\r

          \  </completion_messages>\r

          \r

          \  <decision_documentation>\r

          \    <principle>Document why specific resolutions were
          chosen</principle>\r

          \    <principle>Reference commit SHAs when they influenced
          decisions</principle>\r

          \    <principle>Explain trade-offs when both sides had valid
          changes</principle>\r

          \    \r

          \    <examples>\r

          \      <example>\r

          \        Preserved bugfix from commit abc123 while adapting it to the
          refactored structure from def456\r

          \      </example>\r

          \      <example>\r

          \        Combined both implementations as they addressed different
          aspects of the same feature\r

          \      </example>\r

          \      <example>\r

          \        Chose the more recent implementation as it included
          additional error handling\r

          \      </example>\r

          \    </examples>\r

          \  </decision_documentation>\r

          \r

          \  <special_cases>\r

          \    <case name=\"binary_files\">\r

          \      <message>\r

          \        Binary file conflict in [file]. Based on PR intent
          \"[title]\", choosing [which version] version.\r

          \      </message>\r

          \    </case>\r

          \    \r

          \    <case name=\"deleted_vs_modified\">\r

          \      <message>\r

          \        Conflict: [file] was deleted in one branch but modified in
