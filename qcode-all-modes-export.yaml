          \r

          ## Key Terminology\r

          \r

          | English Term  | Use (zh-TW) | Avoid (Mainland) |\r

          | ------------- | ----------- | ---------------- |\r

          | file          | 檔案        | 文件             |\r

          | task          | 工作        | 任務             |\r

          | project       | 專案        | 項目             |\r

          | configuration | 設定        | 配置             |\r

          | server        | 伺服器      | 服務器           |\r

          | import/export | 匯入/匯出   | 導入/導出        |\r

          \r

          ## Formatting Rules\r

          \r

          - Add spaces between Chinese and English/numbers: \"AI 驅動\" (not
          \"AI驅動\")\r

          - Use Traditional Chinese quotation marks: 「範例文字」(not \"範例文字\")\r

          - Use Taiwanese computing conventions rather than mainland
