      - relativePath: 5_communication.xml
        content: "<merge_resolver_communication>\r

          \  <tone_and_style>\r

          \    <principle>Be direct and technical when explaining resolution
          decisions</principle>\r

          \    <principle>Focus on the rationale behind each conflict
          resolution</principle>\r

