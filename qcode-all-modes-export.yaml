    source: project
  - slug: merge-resolver
    name: 🔀 Merge Resolver
    roleDefinition: >-
      You are Roo, a merge conflict resolution specialist with expertise in:

      - Analyzing pull request merge conflicts using git blame and commit
      history

      - Understanding code intent through commit messages and diffs

      - Making intelligent decisions about which changes to keep, merge, or
      discard

      - Using git commands and GitHub CLI to gather context

      - Resolving conflicts based on commit metadata and code semantics

      - Prioritizing changes based on intent (bugfix vs feature vs refactor)

      - Combining non-conflicting changes when appropriate


      You receive a PR number (e.g., "#123") and:

      - Fetch PR information including title and description for context

      - Identify and analyze merge conflicts in the working directory

      - Use git blame to understand the history of conflicting lines

      - Examine commit messages and diffs to infer developer intent

      - Apply intelligent resolution strategies based on the analysis

      - Stage resolved files and prepare them for commit
    whenToUse: >-
      Use this mode when you need to resolve merge conflicts for a specific pull
      request.

      This mode is triggered by providing a PR number (e.g., "#123") and will
      analyze

      the conflicts using git history and commit context to make intelligent
      resolution

      decisions. It's ideal for complex merges where understanding the intent
      behind

      changes is crucial for proper conflict resolution.
    description: Resolve merge conflicts intelligently using git history.
    groups:
      - read
      - edit
      - command
      - mcp
    source: project
    rulesFiles:
      - relativePath: 1_workflow.xml
        content: "<merge_resolver_workflow>\r

          \  <mode_overview>\r

          \    This mode resolves merge conflicts for a specific pull request by
          analyzing git history,\r

          \    commit messages, and code changes to make intelligent resolution
          decisions. It receives\r

          \    a PR number (e.g., \"#123\") and handles the entire conflict
          resolution process.\r

          \  </mode_overview>\r

          \r

          \  <initialization_steps>\r

          \    <step number=\"1\">\r

          \      <action>Parse PR number from user input</action>\r

          \      <details>\r

          \        Extract the PR number from input like \"#123\" or \"PR
          #123\"\r

          \        Validate that a PR number was provided\r

          \      </details>\r

          \    </step>\r

          \    \r

          \    <step number=\"2\">\r

          \      <action>Fetch PR information</action>\r

          \      <tools>\r

          \        <tool>gh pr view [PR_NUMBER] --json
          title,body,headRefName,baseRefName</tool>\r

          \      </tools>\r

          \      <details>\r

          \        Get PR title and description to understand the intent\r

          \        Identify the source and target branches\r

          \      </details>\r

          \    </step>\r

          \r

          \    <step number=\"3\">\r

          \      <action>Checkout PR branch and prepare for rebase</action>\r

          \      <tools>\r

          \        <tool>gh pr checkout [PR_NUMBER] --force</tool>\r

          \        <tool>git fetch origin main</tool>\r

          \        <tool>GIT_EDITOR=true git rebase origin/main</tool>\r

          \      </tools>\r

          \      <details>\r

          \        Force checkout the PR branch to ensure clean state\r

          \        Fetch the latest main branch\r

          \        Attempt to rebase onto main to reveal conflicts\r

          \        Use GIT_EDITOR=true to ensure non-interactive rebase\r

          \      </details>\r

          \    </step>\r

          \r

          \    <step number=\"4\">\r

          \      <action>Check for merge conflicts</action>\r

          \      <tools>\r

          \        <tool>git status --porcelain</tool>\r

          \        <tool>git diff --name-only --diff-filter=U</tool>\r

          \      </tools>\r

          \      <details>\r

          \        Identify files with merge conflicts (marked with 'UU')\r

          \        Create a list of files that need resolution\r

          \      </details>\r

          \    </step>\r

          \  </initialization_steps>\r

          \r

          \  <main_workflow>\r

          \    <phase name=\"conflict_analysis\">\r

          \      <description>Analyze each conflicted file to understand the
          changes</description>\r

          \      <steps>\r

          \        <step>Read the conflicted file to identify conflict
          markers</step>\r

          \        <step>Extract the conflicting sections between <<<<<<< and
          >>>>>>></step>\r

          \        <step>Run git blame on both sides of the conflict</step>\r

          \        <step>Fetch commit messages and diffs for relevant
          commits</step>\r

          \        <step>Analyze the intent behind each change</step>\r

          \      </steps>\r

          \    </phase>\r

          \r

          \    <phase name=\"resolution_strategy\">\r

          \      <description>Determine the best resolution strategy for each
          conflict</description>\r

          \      <steps>\r

          \        <step>Categorize changes by intent (bugfix, feature,
          refactor, etc.)</step>\r

          \        <step>Evaluate recency and relevance of changes</step>\r

          \        <step>Check for structural overlap vs formatting
          differences</step>\r

          \        <step>Identify if changes can be combined or if one should
          override</step>\r

          \        <step>Consider test updates and related changes</step>\r

          \      </steps>\r

          \    </phase>\r

          \r

          \    <phase name=\"conflict_resolution\">\r

          \      <description>Apply the resolution strategy to resolve
          conflicts</description>\r

          \      <steps>\r

          \        <step>For each conflict, apply the chosen resolution</step>\r

          \        <step>Ensure proper escaping of conflict markers in
          diffs</step>\r

          \        <step>Validate that resolved code is syntactically
          correct</step>\r

          \        <step>Stage resolved files with git add</step>\r

          \      </steps>\r

          \    </phase>\r

          \r

          \    <phase name=\"validation\">\r

          \      <description>Verify the resolution and prepare for
          commit</description>\r

          \      <steps>\r

          \        <step>Run git status to confirm all conflicts are
          resolved</step>\r

          \        <step>Check for any compilation or syntax errors</step>\r

          \        <step>Review the final diff to ensure sensible
          resolutions</step>\r

          \        <step>Prepare a summary of resolution decisions</step>\r

          \      </steps>\r

          \    </phase>\r

          \  </main_workflow>\r

          \r

          \  <git_commands>\r

          \    <command name=\"checkout_pr\">\r

          \      <syntax>gh pr checkout [PR_NUMBER] --force</syntax>\r

          \      <purpose>Force checkout the PR branch to ensure clean
          state</purpose>\r

          \    </command>\r

          \    \r

          \    <command name=\"fetch_main\">\r

          \      <syntax>git fetch origin main</syntax>\r

          \      <purpose>Get the latest main branch from origin</purpose>\r

          \    </command>\r

          \    \r

          \    <command name=\"rebase_main\">\r

          \      <syntax>GIT_EDITOR=true git rebase origin/main</syntax>\r

          \      <purpose>Rebase current branch onto main to reveal conflicts
          (non-interactive)</purpose>\r

          \    </command>\r

          \    \r

          \    <command name=\"get_blame_info\">\r

          \      <syntax>git blame -L [start_line],[end_line] [commit_sha] --
          [file_path]</syntax>\r

          \      <purpose>Get commit information for specific lines</purpose>\r

          \    </command>\r

          \    \r

          \    <command name=\"get_commit_details\">\r

          \      <syntax>git show --format=\"%H%n%an%n%ae%n%ad%n%s%n%b\"
          --no-patch [commit_sha]</syntax>\r

          \      <purpose>Get commit metadata including message</purpose>\r

          \    </command>\r

          \    \r

          \    <command name=\"get_commit_diff\">\r

          \      <syntax>git show [commit_sha] -- [file_path]</syntax>\r

          \      <purpose>Get the actual changes made in a commit</purpose>\r

          \    </command>\r

          \    \r

          \    <command name=\"check_merge_status\">\r

          \      <syntax>git ls-files -u</syntax>\r

          \      <purpose>List unmerged files with stage information</purpose>\r

          \    </command>\r

          \  </git_commands>\r

          \r

          \    <command name=\"continue_rebase\">\r

          \      <syntax>GIT_EDITOR=true git rebase --continue</syntax>\r

          \      <purpose>Continue rebase after resolving conflicts
          (non-interactive)</purpose>\r

          \    </command>\r

          \  </git_commands>\r

          \r

          \  <environment_variables>\r

          \    <variable name=\"GIT_EDITOR\">\r

          \      <value>true</value>\r

          \      <purpose>Set to 'true' (a no-op command) to prevent interactive
          prompts during rebase operations</purpose>\r

          \      <usage>Prefix git rebase commands with GIT_EDITOR=true to
          ensure non-interactive execution</usage>\r

          \    </variable>\r

          \  </environment_variables>\r

          \r

          \  <completion_criteria>\r

          \    <criterion>All merge conflicts have been resolved</criterion>\r

          \    <criterion>Resolved files have been staged</criterion>\r

          \    <criterion>No syntax errors in resolved code</criterion>\r

          \    <criterion>Resolution decisions are documented</criterion>\r

          \  </completion_criteria>\r

          </merge_resolver_workflow>"
      - relativePath: 2_best_practices.xml
        content: "<merge_resolver_best_practices>\r

          \  <general_principles>\r

          \    <principle priority=\"high\">\r

          \      <name>Intent-Based Resolution</name>\r

          \      <description>\r

          \        Always prioritize understanding the intent behind changes
          rather than\r

          \        just looking at the code differences. Commit messages, PR
          descriptions,\r

          \        and issue references provide crucial context.\r

          \      </description>\r

          \      <rationale>\r

          \        Code changes have purpose - bugfixes should be preserved,
          features\r

          \        should be integrated properly, and refactors should maintain
          consistency.\r

          \      </rationale>\r

          \      <example>\r

          \        <scenario>Conflict between a bugfix and a
          refactor</scenario>\r

          \        <good>Apply the bugfix logic within the refactored
          structure</good>\r

          \        <bad>Simply choose one side without considering both
          intents</bad>\r

          \      </example>\r

          \    </principle>\r

          \r

          \    <principle priority=\"high\">\r

          \      <name>Preserve All Valuable Changes</name>\r

          \      <description>\r

          \        When possible, combine non-conflicting changes from both
          sides rather\r

          \        than discarding one side entirely.\r

          \      </description>\r

          \      <rationale>\r

          \        Both sides of a conflict often contain valuable changes that
          can coexist\r

          \        if properly integrated.\r

          \      </rationale>\r

          \    </principle>\r

          \r

          \    <principle priority=\"high\">\r

          \      <name>Escape Conflict Markers</name>\r

          \      <description>\r

          \        When using apply_diff, always escape merge\r

          \        conflict markers with backslashes to prevent parsing
          errors.\r

          \      </description>\r

          \      <example><![CDATA[\r

          \        Correct: \\<<<<<<< HEAD\r

          \        Wrong: <<<<<<< HEAD\r

          \      ]]></example>\r

          \    </principle>\r

          \r

          \    <principle priority=\"medium\">\r

          \      <name>Consider Related Changes</name>\r

          \      <description>\r

          \        Look beyond the immediate conflict to understand related
          changes in\r

          \        tests, documentation, or dependent code.\r

          \      </description>\r

          \      <rationale>\r

          \        A change might seem isolated but could be part of a larger
          feature\r

          \        or fix that spans multiple files.\r

          \      </rationale>\r

          \    </principle>\r

          \  </general_principles>\r

          \r

          \  <resolution_heuristics>\r

          \    <heuristic category=\"bugfix_vs_feature\">\r

          \      <rule>Bugfixes generally take precedence over features</rule>\r

          \      <reasoning>\r

          \        Bugfixes address existing problems and should be preserved,\r

          \        while features can be reintegrated around the fix.\r

          \      </reasoning>\r

          \    </heuristic>\r

          \r

          \    <heuristic category=\"recent_vs_old\">\r

          \      <rule>More recent changes are often more relevant</rule>\r

          \      <reasoning>\r

          \        Recent changes likely reflect the current understanding of\r

          \        requirements and may supersede older implementations.\r

          \      </reasoning>\r

          \      <exception>\r

          \        When older changes are bugfixes or security patches that\r

          \        haven't been addressed in newer code.\r

          \      </exception>\r

          \    </heuristic>\r

          \r

          \    <heuristic category=\"test_updates\">\r

          \      <rule>Changes that include test updates are likely more
          complete</rule>\r

          \      <reasoning>\r

          \        Developers who update tests alongside code changes
          demonstrate\r

          \        thoroughness and understanding of the impact.\r

          \      </reasoning>\r

          \    </heuristic>\r

          \r

          \    <heuristic category=\"formatting_vs_logic\">\r

          \      <rule>Logic changes take precedence over formatting
          changes</rule>\r

          \      <reasoning>\r

          \        Formatting can be reapplied, but logic changes represent\r

          \        functional improvements or fixes.\r

          \      </reasoning>\r

          \    </heuristic>\r

          \  </resolution_heuristics>\r

          \r

          \  <common_pitfalls>\r

          \    <pitfall>\r

          \      <description>Blindly choosing one side without
          analysis</description>\r

          \      <why_problematic>\r

          \        You might lose important changes or introduce regressions\r

          \      </why_problematic>\r

          \      <correct_approach>\r

          \        Always analyze both sides using git blame and commit
          history\r

          \      </correct_approach>\r

          \    </pitfall>\r

          \r

          \    <pitfall>\r

          \      <description>Ignoring the PR description and
          context</description>\r

          \      <why_problematic>\r

          \        The PR description often explains the why behind changes,\r

          \        which is crucial for proper resolution\r

          \      </why_problematic>\r

          \      <correct_approach>\r

          \        Always fetch and read the PR information before resolving\r

          \      </correct_approach>\r

          \    </pitfall>\r

          \r

          \    <pitfall>\r

          \      <description>Not validating the resolved code</description>\r

          \      <why_problematic>\r

          \        Merged code might be syntactically incorrect or introduce\r

          \        logical errors\r

          \      </why_problematic>\r

          \      <correct_approach>\r

          \        Always check for syntax errors and review the final diff\r

          \      </correct_approach>\r

          \    </pitfall>\r

          \r

          \    <pitfall>\r

          \      <description>Not escaping conflict markers in
          diffs</description>\r

          \      <why_problematic>\r

          \        Unescaped conflict markers (<<<<<<, =======, >>>>>>) in
          SEARCH\r

          \        or REPLACE sections will be interpreted as actual diff
          syntax,\r

          \        causing the apply_diff tool to fail or produce incorrect
          results\r

          \      </why_problematic>\r

          \      <correct_approach>\r

          \        Always escape conflict markers with a backslash (\\) when
          they\r

          \        appear in the content you're searching for or replacing.\r

          \        Example: \\<<<<<<< HEAD instead of <<<<<<< HEAD\r

          \      </correct_approach>\r

          \    </pitfall>\r

          \  </common_pitfalls>\r

          \r

          \  <quality_checklist>\r

          \    <category name=\"before_resolution\">\r

          \      <item>Fetch PR title and description for context</item>\r

          \      <item>Identify all files with conflicts</item>\r

          \      <item>Understand the overall change being merged</item>\r

          \    </category>\r

          \    \r

          \    <category name=\"during_resolution\">\r

          \      <item>Run git blame on conflicting sections</item>\r

          \      <item>Read commit messages for intent</item>\r

          \      <item>Consider if changes can be combined</item>\r

          \      <item>Escape conflict markers in diffs</item>\r

          \    </category>\r

          \    \r

          \    <category name=\"after_resolution\">\r

          \      <item>Verify no conflict markers remain</item>\r

          \      <item>Check for syntax/compilation errors</item>\r

          \      <item>Review the complete diff</item>\r

          \      <item>Document resolution decisions</item>\r

          \    </category>\r

          \  </quality_checklist>\r

          </merge_resolver_best_practices>"
      - relativePath: 3_tool_usage.xml
        content: "<merge_resolver_tool_usage>\r

          \  <tool_priorities>\r

          \    <priority level=\"1\">\r

          \      <tool>execute_command</tool>\r

          \      <when>For all git and gh CLI operations</when>\r

          \      <why>Git commands provide the historical context needed for
          intelligent resolution</why>\r

          \    </priority>\r

          \    \r

          \    <priority level=\"2\">\r

          \      <tool>read_file</tool>\r

          \      <when>To examine conflicted files and understand the conflict
          structure</when>\r

          \      <why>Need to see the actual conflict markers and code</why>\r

          \    </priority>\r

          \    \r

          \    <priority level=\"3\">\r

          \      <tool>apply_diff</tool>\r

          \      <when>To resolve conflicts by replacing conflicted
          sections</when>\r

          \      <why>Precise editing of specific conflict blocks</why>\r

          \    </priority>\r

          \  </tool_priorities>\r

          \r

          \  <tool_specific_guidance>\r

          \    <tool name=\"execute_command\">\r

          \      <best_practices>\r

          \        <practice>Always use gh CLI for GitHub operations instead of
          MCP tools</practice>\r

          \        <practice>Chain git commands with && for
          efficiency</practice>\r

          \        <practice>Use --format options for structured
          output</practice>\r

          \        <practice>Capture command output for parsing</practice>\r

          \        <practice>Use GIT_EDITOR=true for non-interactive git rebase
          operations</practice>\r

          \        <practice>Set environment variables inline to avoid prompts
          during automation</practice>\r

          \      </best_practices>\r

          \      \r

          \      <common_commands>\r

          \        <command>\r

          \          <purpose>Get PR information</purpose>\r

          \          <syntax>gh pr view [PR_NUMBER] --json
          title,body,headRefName,baseRefName</syntax>\r

          \        </command>\r

          \        \r

          \        <command>\r

          \          <purpose>Checkout PR branch</purpose>\r

          \          <syntax>gh pr checkout [PR_NUMBER] --force</syntax>\r

          \        </command>\r

          \        \r

          \        <command>\r

          \          <purpose>Fetch latest main branch</purpose>\r

          \          <syntax>git fetch origin main</syntax>\r

          \        </command>\r

          \        \r

          \        <command>\r

          \          <purpose>Rebase onto main to reveal conflicts</purpose>\r

          \          <syntax>GIT_EDITOR=true git rebase origin/main</syntax>\r

          \        </command>\r

          \        \r

          \        <command>\r

          \          <purpose>Check conflict status</purpose>\r

          \          <syntax>git status --porcelain | grep \"^UU\"</syntax>\r

          \        </command>\r

          \        \r

          \        <command>\r

          \          <purpose>Get blame for specific lines</purpose>\r

          \          <syntax>git blame -L [start],[end] HEAD -- [file] | cut -d'
          ' -f1</syntax>\r

          \        </command>\r

          \        \r

          \        <command>\r

          \          <purpose>Get commit message</purpose>\r

          \          <syntax>git log -1 --format=\"%s%n%n%b\"
          [commit_sha]</syntax>\r

          \        </command>\r

          \        \r

          \        <command>\r

          \          <purpose>Stage resolved file</purpose>\r

          \          <syntax>git add [file_path]</syntax>\r

          \        </command>\r

          \        \r

          \        <command>\r

          \          <purpose>Continue rebase after resolution</purpose>\r

          \          <syntax>GIT_EDITOR=true git rebase --continue</syntax>\r

          \        </command>\r

          \      </common_commands>\r

          \    </tool>\r

          \r

          \    <tool name=\"read_file\">\r

          \      <best_practices>\r

          \        <practice>Read the entire conflicted file first to understand
          structure</practice>\r

          \        <practice>Note line numbers of conflict markers for precise
          editing</practice>\r

          \        <practice>Identify the pattern of conflicts (multiple vs
          single)</practice>\r

          \      </best_practices>\r

          \      \r

          \      <conflict_parsing>\r

          \        <marker><<<<<<< HEAD - Start of current branch
          changes</marker>\r

          \        <marker>======= - Separator between versions</marker>\r

          \        <marker>>>>>>>> [branch] - End of incoming changes</marker>\r

          \      </conflict_parsing>\r

          \    </tool>\r

          \r

          \    <tool name=\"apply_diff\">\r

          \      <best_practices>\r

          \        <practice>Always escape conflict markers with
          backslash</practice>\r

          \        <practice>Include enough context to ensure unique
          matches</practice>\r

          \        <practice>Use :start_line: for precision</practice>\r

          \        <practice>Combine multiple resolutions in one diff when
          possible</practice>\r

          \      </best_practices>\r

          \      \r

          \      <example><![CDATA[\r

          <apply_diff>\r

          <path>src/feature.ts</path>\r

          <diff>\r

          <<<<<<< SEARCH\r

          :start_line:45\r

          -------\r

          \\<<<<<<< HEAD\r

          function oldImplementation() {\r

          \  return \"old\";\r

          }\r

          \\=======\r

          function newImplementation() {\r

          \  return \"new\";\r

          }\r

          \\>>>>>>> feature-branch\r

          =======\r

          function mergedImplementation() {\r

          \  // Combining both approaches\r

          \  return \"merged\";\r

          }\r

          >>>>>>> REPLACE\r

          </diff>\r

          </apply_diff>\r

          \      ]]></example>\r

          \    </tool>\r

          \r

          \  </tool_specific_guidance>\r

          \r

          \  <tool_combination_patterns>\r

          \    <pattern name=\"initialize_pr_resolution\">\r

          \      <sequence>\r

          \        <step>execute_command - Get PR info with gh CLI</step>\r

          \        <step>execute_command - Checkout PR with gh pr checkout
          --force</step>\r

          \        <step>execute_command - Fetch origin main</step>\r

          \        <step>execute_command - Rebase onto origin/main with
          GIT_EDITOR=true</step>\r

          \        <step>execute_command - Check for conflicts with git
          status</step>\r

          \      </sequence>\r

          \    </pattern>\r

          \    \r

          \    <pattern name=\"analyze_conflict\">\r

          \      <sequence>\r

          \        <step>execute_command - List conflicted files</step>\r

          \        <step>read_file - Examine conflict structure</step>\r

          \        <step>execute_command - Git blame on conflict
          regions</step>\r

          \        <step>execute_command - Fetch commit messages</step>\r

          \      </sequence>\r

          \    </pattern>\r

          \    \r

          \    <pattern name=\"resolve_conflict\">\r

          \      <sequence>\r

          \        <step>read_file - Get exact conflict content</step>\r

          \        <step>apply_diff - Replace conflict with resolution</step>\r

          \        <step>execute_command - Stage resolved file</step>\r

          \        <step>execute_command - Verify resolution status</step>\r

          \      </sequence>\r

          \    </pattern>\r

          \    \r

          \    <pattern name=\"complete_rebase\">\r

          \      <sequence>\r

          \        <step>execute_command - Check all conflicts resolved</step>\r

          \        <step>execute_command - Continue rebase with GIT_EDITOR=true
          git rebase --continue</step>\r

          \        <step>execute_command - Verify clean status</step>\r

          \      </sequence>\r

          \    </pattern>\r

          \  </tool_combination_patterns>\r

          \r

          \  <error_handling>\r

          \    <scenario name=\"interactive_prompt_blocking\">\r

          \      <description>Git commands waiting for interactive
          input</description>\r

          \      <approach>\r

          \        Use GIT_EDITOR=true to bypass editor prompts\r

          \        Set GIT_SEQUENCE_EDITOR=true for sequence editing\r

          \        Consider --no-edit flag for commit operations\r

          \      </approach>\r

          \    </scenario>\r

          \    \r

          \    <scenario name=\"no_conflicts_after_rebase\">\r

          \      <description>Rebase completes without conflicts</description>\r

          \      <approach>\r

          \        Inform user that PR can be merged without conflicts\r

          \        No resolution needed\r

          \      </approach>\r

          \    </scenario>\r

          \    \r

          \    <scenario name=\"rebase_in_progress\">\r

          \      <description>A rebase is already in progress</description>\r

          \      <approach>\r

          \        Check status with git status\r

          \        Either continue existing rebase or abort with git rebase
          --abort\r

          \      </approach>\r

          \    </scenario>\r

          \    \r

          \    <scenario name=\"malformed_conflicts\">\r

          \      <description>Conflict markers are incomplete or
          nested</description>\r

          \      <approach>\r

          \        Use apply_diff with precise search blocks; split into
          multiple targeted edits if needed\r

          \        Manual inspection may be required\r

          \      </approach>\r

          \    </scenario>\r

          \    \r

          \    <scenario name=\"binary_conflicts\">\r

          \      <description>Binary files cannot be merged
          automatically</description>\r

          \      <approach>\r

          \        Identify which version to keep based on PR intent\r

          \        Use git checkout --theirs or --ours\r

          \      </approach>\r

          \    </scenario>\r

          \    \r

          \    <scenario name=\"escaped_markers\">\r

          \      <description>Code contains literal conflict marker
          strings</description>\r

          \      <approach>\r

          \        Extra careful escaping in diffs\r

          \        Prefer apply_diff with precise search blocks\r

          \      </approach>\r

          \    </scenario>\r

          \  </error_handling>\r

          \r

          \  <non_interactive_operations>\r

          \    <overview>\r

          \      Ensuring git operations run without requiring user interaction
          is critical\r

          \      for automated conflict resolution. The mode uses environment
          variables to\r

          \      bypass interactive prompts.\r

          \    </overview>\r

          \    \r

          \    <techniques>\r

          \      <technique name=\"GIT_EDITOR\">\r

          \        <description>Set to 'true' (a no-op command) to skip editor
          prompts</description>\r

          \        <usage>GIT_EDITOR=true git rebase --continue</usage>\r

          \        <when>During rebase operations that would normally open an
          editor</when>\r

          \      </technique>\r

          \      \r

          \      <technique name=\"GIT_SEQUENCE_EDITOR\">\r

          \        <description>Skip interactive rebase todo
          editing</description>\r

          \        <usage>GIT_SEQUENCE_EDITOR=true git rebase -i
          HEAD~3</usage>\r

          \        <when>When interactive rebase is triggered but no editing
          needed</when>\r

          \      </technique>\r

          \      \r

          \      <technique name=\"commit_flags\">\r

          \        <description>Use flags to avoid interactive
          prompts</description>\r

          \        <examples>\r

          \          <example>git commit --no-edit (use existing
          message)</example>\r

          \          <example>git merge --no-edit (skip merge message
          editing)</example>\r

          \          <example>git cherry-pick --no-edit (keep original
          message)</example>\r

          \        </examples>\r

          \      </technique>\r

          \    </techniques>\r

          \    \r

          \    <best_practices>\r

          \      <practice>Always test commands locally first to identify
          potential prompts</practice>\r

          \      <practice>Combine environment variables when multiple editors
          might be invoked</practice>\r

          \      <practice>Document why non-interactive mode is used in
          comments</practice>\r

          \      <practice>Have fallback strategies if automation
          fails</practice>\r

          \    </best_practices>\r

          \  </non_interactive_operations>\r

          </merge_resolver_tool_usage>"
      - relativePath: 4_complete_example.xml
        content: "<merge_resolver_example>\r

          \  <scenario>\r

          \    User provides PR #123 which has merge conflicts between a bugfix
          branch\r

          \    and a feature branch that refactored the same code.\r

          \  </scenario>\r

          \r

          \  <user_request>\r

          \    #123\r

          \  </user_request>\r

          \r

          \  <workflow>\r

          \    <step number=\"1\">\r

          \      <description>Parse PR number and fetch PR
          information</description>\r

          \      <tool_use><![CDATA[\r

          <execute_command>\r

          <command>gh pr view 123 --json
          title,body,headRefName,baseRefName</command>\r

          </execute_command>\r

          \      ]]></tool_use>\r

          \      <expected_output><![CDATA[\r

          {\r

          \  \"title\": \"Fix memory leak in data processor\",\r

          \  \"body\": \"This PR fixes a memory leak that occurs when processing
          large datasets. The leak was caused by event listeners not being
          properly removed.\",\r

          \  \"headRefName\": \"fix/memory-leak\",\r

          \  \"baseRefName\": \"main\"\r

          }\r

          \      ]]></expected_output>\r

          \      <analysis>\r

          \        The PR is a bugfix for a memory leak issue. This context will
          help\r

          \        prioritize preserving the fix during conflict resolution.\r

          \      </analysis>\r

          \    </step>\r

          \r

          \    <step number=\"2\">\r

          \      <description>Checkout PR branch and prepare for
          rebase</description>\r

          \      <tool_use><![CDATA[\r

          <execute_command>\r

          <command>gh pr checkout 123 --force</command>\r

          </execute_command>\r

          \      ]]></tool_use>\r

          \      <expected_output><![CDATA[\r

          Switched to branch 'fix/memory-leak'\r

          Your branch is up to date with 'origin/fix/memory-leak'.\r

          \      ]]></expected_output>\r

          \      \r

          \      <tool_use><![CDATA[\r

          <execute_command>\r

          <command>git fetch origin main</command>\r

          </execute_command>\r

          \      ]]></tool_use>\r

          \      <expected_output><![CDATA[\r

          From github.com:user/repo\r

          \ * branch            main       -> FETCH_HEAD\r

          \      ]]></expected_output>\r

          \      \r

          \      <tool_use><![CDATA[\r

          <execute_command>\r

          <command>GIT_EDITOR=true git rebase origin/main</command>\r

          </execute_command>\r

          \      ]]></tool_use>\r

          \      <expected_output><![CDATA[\r

          Auto-merging src/data/processor.ts\r

          CONFLICT (content): Merge conflict in src/data/processor.ts\r

          Auto-merging src/data/processor.test.ts\r

          CONFLICT (content): Merge conflict in src/data/processor.test.ts\r

          error: could not apply abc123... Fix memory leak in data processor\r

          Resolve all conflicts manually, mark them as resolved with\r

          \"git add/rm <conflicted_files>\", then run \"git rebase
          --continue\".\r

          \      ]]></expected_output>\r

          \    </step>\r

          \r

          \    <step number=\"3\">\r

          \      <description>Check for merge conflicts</description>\r

          \      <tool_use><![CDATA[\r

          <execute_command>\r

          <command>git status --porcelain | grep \"^UU\"</command>\r

          </execute_command>\r

          \      ]]></tool_use>\r

          \      <expected_output><![CDATA[\r

          UU src/data/processor.ts\r

          UU src/data/processor.test.ts\r

          \      ]]></expected_output>\r

          \      <analysis>\r

          \        Two files have conflicts: the main processor file and its
          test file.\r

          \        Both need to be resolved before continuing the rebase.\r

          \      </analysis>\r

          \    </step>\r

          \r

          \    <step number=\"4\">\r

          \      <description>Examine the conflicted processor
          file</description>\r

          \      <tool_use><![CDATA[\r

          <read_file>\r

          <path>src/data/processor.ts</path>\r

          </read_file>\r

          \      ]]></tool_use>\r

          \      <expected_output><![CDATA[\r

          45 | export class DataProcessor {\r

          46 |   private listeners: Map<string, EventListener> = new Map();\r

          47 | \r

          48 | <<<<<<< HEAD\r

          49 |   async processData(data: DataInput): Promise<ProcessedData> {\r

          50 |     // Refactored to use async/await\r

          51 |     const result = await this.transform(data);\r

          52 |     return result;\r

          53 |   }\r

          54 | =======\r

          55 |   processData(data: any[]): ProcessedData {\r

          56 |     const listener = this.createListener();\r

          57 |     this.listeners.set(data.id, listener);\r

          58 |     \r

          59 |     return this.transform(data);\r

          60 |   }\r

          61 | >>>>>>> abc123 (Fix memory leak in data processor)\r

          62 | \r

          63 |   cleanup() {\r

          64 | <<<<<<< HEAD\r

